version: 3

tasks:

  create_models:
    desc: Given a XSD, generates the related Pydantic v2 models.
    preconditions:
    - sh: command -v uv >/dev/null 2>&1
      msg: "Missing uv, see https://docs.astral.sh/uv/"
    dir: '{{.OUTPUT_DIR}}'
    cmds:
    - |
      uv run \
      --no-project \
      --python 3.12 \
      --with "xsdata[cli,lxml]==26.10" \
      --with "xsdata-pydantic==24.5" \
      xsdata generate {{.SCHEMA}} \
      --output pydantic \
      --package {{.PACKAGE}}
